name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test_macos:
    name: cargo test / clippy (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Test macOS fallback glyph rasterization
        run: cargo test --manifest-path vendor/gpui/Cargo.toml --features runtime_shaders --lib platform::mac::text_system::tests

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test_windows:
    name: cargo test / clippy (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
