name: CI

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  release_only_detector:
    name: Classify release-only Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_only: ${{ steps.classify.outputs.release_only }}
    steps:
      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact Pull Request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"

      - name: Classify the exact base-to-head diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -f .github/scripts/release_pr.py ]]; then
            python3 .github/scripts/release_pr.py classify \
              --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          else
            echo "release_only=false" >> "$GITHUB_OUTPUT"
            echo "Trusted release classifier is not present in the base revision; using normal CI."
          fi

  rust_ci_changes:
    name: Determine whether Rust CI is required
    needs: release_only_detector
    if: ${{ needs.release_only_detector.result == 'success' && needs.release_only_detector.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
      windows_gui_lock_required: ${{ steps.filter.outputs.windows_gui_lock_required }}
      macos_gui_validator_lock_required: ${{ steps.filter.outputs.macos_gui_validator_lock_required }}
    steps:
      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test Rust CI path filter
        run: python3 .github/tests/test_rust_ci_path_filter.py

      - name: Test Windows GUI lock CI wiring
        run: python3 .github/tests/test_windows_gui_lock_ci_wiring.py

      - name: Test AADW action and diagnostic contract
        run: python3 .github/tests/test_aadw_action_contract.py

      - name: Test AADW prevention entrypoint wiring
        run: python3 .github/tests/test_aadw_prevention_wiring.py

      - name: Test GUI observation quality classification
        run: python3 scripts/tests/test_aadw_gui_observation.py

      - name: Test AADW GUI command policy
        run: python3 .github/tests/test_aadw_gui_command.py

      - name: Test saved GUI artifact OCR replay
        run: python3 .github/tests/test_aadw_gui_ocr_replay.py

      - name: Test code-block focused GUI procedure
        run: python3 scripts/tests/test_hosted_code_block_gui.py

      - name: Test file-tab focused GUI procedure
        run: python3 scripts/tests/test_hosted_file_tabs_gui.py

      - name: Test scroll-inertia focused GUI procedure
        run: python3 scripts/tests/test_hosted_scroll_inertia_gui.py

      - name: Test AADW Jev contract
        if: ${{ hashFiles('scripts/tests/test_aadw_jev_contract.py') != '' }}
        run: python3 scripts/tests/test_aadw_jev_contract.py

      - name: Test Claude failure diagnostics
        run: python3 .github/tests/test_claude_failure_diagnostic.py

      - name: Test AADW successful patch continuation provenance
        run: python3 .github/tests/test_aadw_patch_resume.py

      - name: Test Claude model verification
        run: python3 .github/tests/test_claude_model_verification.py

      - name: Test Codex usage-limit fallback wiring
        run: python3 .github/tests/test_codex_usage_limit_fallback.py

      - name: Test release version policy
        run: python3 .github/tests/test_release_version.py

      - name: Test release PR policy
        run: python3 .github/tests/test_release_pr.py

      - name: Install release tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling requirements
        run: python -m pip install -r scripts/release-requirements.txt

      - name: Test Windows ZIP layout contract
        run: python scripts/tests/test_windows_zip_layout.py

      - name: Test update release pipeline fixtures
        run: python scripts/tests/test_release_catalog.py

      - name: Test update release workflow wiring
        run: python scripts/tests/test_release_workflows.py

      - name: Detect Rust CI inputs
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required="$(
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" \
              | python3 .github/scripts/rust_ci_path_filter.py --null
          )"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          windows_gui_lock_required="$(
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" \
              | python3 .github/scripts/rust_ci_path_filter.py --null --windows-gui-lock
          )"
          echo "windows_gui_lock_required=$windows_gui_lock_required" >> "$GITHUB_OUTPUT"
          macos_gui_validator_lock_required="$(
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" \
              | python3 .github/scripts/rust_ci_path_filter.py --null --macos-gui-validator-lock
          )"
          echo "macos_gui_validator_lock_required=$macos_gui_validator_lock_required" >> "$GITHUB_OUTPUT"

  release_checks:
    name: Lightweight release checks
    needs: release_only_detector
    if: ${{ needs.release_only_detector.result == 'success' && needs.release_only_detector.outputs.release_only == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact Pull Request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Install Rust toolchain
        run: rustup show

      - name: Find latest semantic-version tag
        id: latest_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_names_file="$(mktemp)"
          trap 'rm -f "$tag_names_file"' EXIT
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            --jq '.[].name' > "$tag_names_file"
          latest_tag="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' "$tag_names_file" | sort -V | tail -n 1 || true)"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Validate release scope and version
        id: validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LATEST_TAG: ${{ steps.latest_tag.outputs.latest_tag }}
        run: |
          python3 .github/scripts/release_pr.py validate \
            --base "$BASE_SHA" --head "$HEAD_SHA" --latest-tag "$LATEST_TAG" \
            --head-ref "$HEAD_REF" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run release policy tests
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$HEAD_SHA:Cargo.toml" > Cargo.toml
          git show "$HEAD_SHA:Cargo.lock" > Cargo.lock
          python3 .github/tests/test_release_version.py
          python3 .github/tests/test_release_pr.py

      - name: Verify Cargo workspace and lock file
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Add release label and skip-review marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh label create release --description "自動リリース用の版番号更新PR" \
            --color "0E8A16" --force --repo "$GITHUB_REPOSITORY"
          gh pr edit "$PR_NUMBER" --add-label release --repo "$GITHUB_REPOSITORY"
          title="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq '.title')"
          case "$title" in
            "[skip review]"*) ;;
            *) gh pr edit "$PR_NUMBER" --title "[skip review] $title" --repo "$GITHUB_REPOSITORY" ;;
          esac

  test_macos:
    name: cargo test / clippy (macos-latest)
    needs: [release_only_detector, rust_ci_changes]
    if: ${{ github.event_name == 'pull_request' && always() && (needs.release_only_detector.result != 'success' || (needs.release_only_detector.outputs.release_only != 'true' && (needs.rust_ci_changes.result != 'success' || needs.rust_ci_changes.outputs.required == 'true'))) }}
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Fail when release-only detection failed
        if: ${{ needs.release_only_detector.result != 'success' }}
        run: exit 1

      - name: Fail when Rust CI path detection failed
        if: ${{ needs.rust_ci_changes.result != 'success' }}
        run: exit 1

      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Test macOS fallback glyph rasterization
        run: cargo test --manifest-path vendor/gpui-pre-macos/Cargo.toml --features runtime_shaders,font-kit,test-support --lib hane_oblique

      - name: Test macOS input source reactivation
        run: cargo test --manifest-path vendor/gpui-pre-macos/Cargo.toml --features runtime_shaders,font-kit,test-support --lib hane_input_source

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test_windows:
    name: cargo test / clippy (windows-latest)
    needs: [release_only_detector, rust_ci_changes]
    if: ${{ github.event_name == 'pull_request' && always() && (needs.release_only_detector.result != 'success' || (needs.release_only_detector.outputs.release_only != 'true' && (needs.rust_ci_changes.result != 'success' || needs.rust_ci_changes.outputs.required == 'true'))) }}
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Fail when release-only detection failed
        if: ${{ needs.release_only_detector.result != 'success' }}
        run: exit 1

      - name: Fail when Rust CI path detection failed
        if: ${{ needs.rust_ci_changes.result != 'success' }}
        run: exit 1

      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Test Windows IME notification dispatch
        run: cargo test --manifest-path vendor/gpui-pre-windows/Cargo.toml --features test-support --lib hane_input_mode_notification

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  windows_gui_lock_tests:
    name: Windows GUI lock lifecycle tests
    needs: [release_only_detector, rust_ci_changes]
    if: >-
      github.event_name == 'pull_request' &&
      always() &&
      needs.release_only_detector.result == 'success' &&
      needs.release_only_detector.outputs.release_only != 'true' &&
      needs.rust_ci_changes.result == 'success' &&
      needs.rust_ci_changes.outputs.windows_gui_lock_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Windows GUI lock lifecycle tests
        run: python scripts/tests/test_windows_gui_lock_launcher.py

  macos_gui_validator_lock_tests:
    name: macOS GUI validator lock tests
    needs: [release_only_detector, rust_ci_changes]
    if: >-
      github.event_name == 'pull_request' &&
      always() &&
      needs.release_only_detector.result == 'success' &&
      needs.release_only_detector.outputs.release_only != 'true' &&
      needs.rust_ci_changes.result == 'success' &&
      (
        needs.rust_ci_changes.outputs.macos_gui_validator_lock_required == 'true' ||
        needs.rust_ci_changes.outputs.windows_gui_lock_required == 'true'
      )
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run existing macOS GUI validator lock tests
        run: python scripts/tests/test_gui_validate.py

  merge_release_pr:
    name: Merge release PR and start Release builds
    needs: [release_only_detector, release_checks, test_macos, test_windows]
    if: ${{ always() && needs.release_only_detector.result == 'success' && needs.release_only_detector.outputs.release_only == 'true' && needs.release_checks.result == 'success' && needs.test_macos.result == 'skipped' && needs.test_windows.result == 'skipped' }}
    concurrency:
      group: release-pr-merge-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Verify current head, base, checks, and mergeability
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_VERSION: ${{ needs.release_checks.outputs.release_version }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$EXPECTED_BASE_SHA"
          for attempt in $(seq 1 6); do
            pr="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json state,headRefName,headRefOid,baseRefName,baseRefOid,mergeable,labels)"
            mergeable="$(jq -r '.mergeable // "UNKNOWN"' <<< "$pr")"
            if [ "$mergeable" != "UNKNOWN" ]; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 5
            fi
          done
          if [ "$mergeable" = "UNKNOWN" ]; then
            echo "GitHub did not finish calculating release PR mergeability." >&2
            exit 1
          fi
          jq -e \
            --arg head "$EXPECTED_HEAD_SHA" \
            --arg head_ref "$EXPECTED_HEAD_REF" \
            --arg release_branch "release/$RELEASE_VERSION" \
            --arg base "$EXPECTED_BASE_SHA" \
            '.state == "OPEN" and .headRefOid == $head and .headRefName == $head_ref and .headRefName == $release_branch and .baseRefName == "main" and .baseRefOid == $base and .mergeable == "MERGEABLE" and any(.labels[]; .name == "release")' \
            <<< "$pr" >/dev/null
          gh pr checks "$PR_NUMBER" --required --repo "$GITHUB_REPOSITORY"

      - name: Merge with the tested head SHA
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$EXPECTED_BASE_SHA"
          result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$EXPECTED_HEAD_SHA" -f merge_method=squash)"
          jq -e '.merged == true' <<< "$result" >/dev/null
          merge_sha="$(jq -er '.sha' <<< "$result")"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Start the existing Release builds workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_checks.outputs.release_version }}
          RELEASE_SOURCE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          gh workflow run windows-release.yml --repo "$GITHUB_REPOSITORY" \
            --ref main --field "version=$RELEASE_TAG" \
            --field "expected_sha=$RELEASE_SOURCE_SHA"

