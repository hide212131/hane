name: CI

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust_ci_changes:
    name: Determine whether Rust CI is required
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test Rust CI path filter
        run: python3 .github/tests/test_rust_ci_path_filter.py

      - name: Test AADW GUI command policy
        run: python3 .github/tests/test_aadw_gui_command.py

      - name: Test code-block focused GUI procedure
        run: python3 scripts/tests/test_hosted_code_block_gui.py

      - name: Test Claude failure diagnostics
        run: python3 .github/tests/test_claude_failure_diagnostic.py

      - name: Test Codex usage-limit fallback wiring
        run: python3 .github/tests/test_codex_usage_limit_fallback.py

      - name: Test release version policy
        run: python3 .github/tests/test_release_version.py

      - name: Detect Rust CI inputs
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required="$(
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" \
              | python3 .github/scripts/rust_ci_path_filter.py --null
          )"
          echo "required=$required" >> "$GITHUB_OUTPUT"

  test_macos:
    name: cargo test / clippy (macos-latest)
    needs: rust_ci_changes
    if: ${{ always() && (needs.rust_ci_changes.result != 'success' || needs.rust_ci_changes.outputs.required == 'true') }}
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Fail when Rust CI path detection failed
        if: ${{ needs.rust_ci_changes.result != 'success' }}
        run: exit 1

      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Test macOS fallback glyph rasterization
        run: cargo test --manifest-path vendor/gpui/Cargo.toml --features runtime_shaders --lib platform::mac::text_system::tests

      - name: Test macOS input source reactivation
        run: cargo test --manifest-path vendor/gpui/Cargo.toml --features runtime_shaders --lib platform::mac::platform::tests::keyboard_selection_change_reactivates_text_context_once_and_ignores_other_responders -- --exact

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test_windows:
    name: cargo test / clippy (windows-latest)
    needs: rust_ci_changes
    if: ${{ always() && (needs.rust_ci_changes.result != 'success' || needs.rust_ci_changes.outputs.required == 'true') }}
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Fail when Rust CI path detection failed
        if: ${{ needs.rust_ci_changes.result != 'success' }}
        run: exit 1

      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
