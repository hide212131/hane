name: Request release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (例: v0.24.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  create_release_pr:
    name: Create release Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.create.outputs.release_tag }}
      branch: ${{ steps.validate.outputs.branch }}
      pr_number: ${{ steps.create.outputs.pr_number }}
      pr_url: ${{ steps.create.outputs.pr_url }}
      head_sha: ${{ steps.create.outputs.head_sha }}
    steps:
      - name: Validate workflow ref and automation token
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run Request release from the main branch." >&2
            exit 1
          fi
          if [ -z "$RELEASE_AUTOMATION_TOKEN" ]; then
            echo "Repository secret RELEASE_AUTOMATION_TOKEN is required. It must allow contents, pull requests, and issues write access so the created PR triggers normal CI without an approval pause." >&2
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Validate version and automation token
        id: validate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the vMAJOR.MINOR.PATCH form, for example v0.24.0." >&2
            exit 1
          fi
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "hane") | .version')"
          current_tag="v$cargo_version"
          if [ "$(printf '%s\n%s\n' "$current_tag" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ] || [ "$VERSION" = "$current_tag" ]; then
            echo "Requested version $VERSION must be newer than main's $current_tag." >&2
            exit 1
          fi

          tag_names_file="$(mktemp)"
          trap 'rm -f "$tag_names_file"' EXIT
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > "$tag_names_file"
          if grep -Fxq -- "$VERSION" "$tag_names_file"; then
            echo "Tag already exists: $VERSION" >&2
            exit 1
          fi
          latest_tag="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' "$tag_names_file" | sort -V | tail -n 1 || true)"
          if [ -n "$latest_tag" ] && [ "$(printf '%s\n%s\n' "$latest_tag" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "Requested version $VERSION must be newer than latest tag $latest_tag." >&2
            exit 1
          fi

          release_version="${VERSION#v}"
          branch="release/$VERSION"
          open_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number,url)"
          if [ "$(jq 'length' <<< "$open_prs")" -ne 0 ]; then
            echo "An open release PR already exists for $VERSION." >&2
            jq -r '.[].url' <<< "$open_prs" >&2
            exit 1
          fi
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1
          branch_status=$?
          set -e
          if [ "$branch_status" -eq 0 ]; then
            echo "Release branch already exists: $branch" >&2
            exit 1
          elif [ "$branch_status" -ne 2 ]; then
            echo "Could not verify whether release branch $branch exists." >&2
            exit 1
          fi
          echo "release_tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare and open release PR
        id: create
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
          RELEASE_BRANCH: ${{ steps.validate.outputs.branch }}
          EXPECTED_BASE_SHA: ${{ steps.validate.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_pr.py prepare --version "$RELEASE_VERSION"
          python3 .github/tests/test_release_version.py
          python3 .github/tests/test_release_pr.py
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check
          changed_files="$(git diff --name-only)"
          if [ "$changed_files" != $'Cargo.lock\nCargo.toml' ]; then
            echo "Release preparation changed unexpected files:" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: prepare $RELEASE_TAG release"
          head_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

          gh label create release --description "自動リリース用の版番号更新PR" \
            --color "0E8A16" --force --repo "$GITHUB_REPOSITORY"
          body_file="$RUNNER_TEMP/release-pr-body.md"
          cat > "$body_file" <<EOF
          ## 概要
          $RELEASE_TAG のリリースに向け、workspace version と Cargo.lock 内の workspace package version を更新します。

          ## 検証
          - workspace の全 package 名を cargo metadata から取得して版を同期
          - Cargo.toml と Cargo.lock 以外は変更しない
          - Release PR 専用の軽量CIで差分範囲、版の一致、lock の外部 package 不変を確認

          Release PR の自動化: Issue #453
          EOF
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$RELEASE_BRANCH" \
            --title "[skip review] chore: $RELEASE_TAG のリリース準備" \
            --body-file "$body_file" --label release)"
          pr_json="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" \
            --json number,url,headRefOid,baseRefOid)"
          echo "pr_number=$(jq -r '.number' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r '.url' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.headRefOid' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  wait_for_release:
    name: Wait for checks, merge, and published assets
    needs: create_release_pr
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for release PR CI and automatic merge
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.create_release_pr.outputs.pr_number }}
          PR_URL: ${{ needs.create_release_pr.outputs.pr_url }}
          BRANCH: ${{ needs.create_release_pr.outputs.branch }}
          HEAD_SHA: ${{ needs.create_release_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            pr="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json state,headRefName,headRefOid,baseRefName)"
            jq -e --arg branch "$BRANCH" --arg sha "$HEAD_SHA" \
              '.headRefName == $branch and .headRefOid == $sha and .baseRefName == "main" and (.state == "OPEN" or .state == "MERGED")' \
              <<< "$pr" >/dev/null || {
                echo "Release PR no longer matches the requested branch and head SHA: $PR_URL" >&2
                exit 1
              }
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$BRANCH" --event pull_request --limit 20 \
              --json databaseId,headBranch,headSha,createdAt,status,conclusion)"
            run_id="$(jq -r --arg branch "$BRANCH" --arg sha "$HEAD_SHA" \
              '[.[] | select(.headBranch == $branch and .headSha == $sha)] | sort_by(.createdAt) | last | .databaseId // empty' \
              <<< "$runs")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "Release PR CI run did not start: $PR_URL" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --compact

          run="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json event,headBranch,headSha,jobs)"
          jq -e --arg branch "$BRANCH" --arg sha "$HEAD_SHA" \
            '.event == "pull_request" and .headBranch == $branch and .headSha == $sha' \
            <<< "$run" >/dev/null
          jobs="$(jq '.jobs | map({name, conclusion})' <<< "$run")"
          jq -e 'any(.[]; .name == "Lightweight release checks" and .conclusion == "success")' <<< "$jobs" >/dev/null
          jq -e 'any(.[]; .name == "cargo test / clippy (macos-latest)" and .conclusion == "skipped")' <<< "$jobs" >/dev/null
          jq -e 'any(.[]; .name == "cargo test / clippy (windows-latest)" and .conclusion == "skipped")' <<< "$jobs" >/dev/null
          jq -e 'any(.[]; .name == "Merge release PR and start Release builds" and .conclusion == "success")' <<< "$jobs" >/dev/null

          pr="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefName,headRefOid,mergeCommit)"
          jq -e --arg branch "$BRANCH" --arg sha "$HEAD_SHA" \
            '.state == "MERGED" and .headRefName == $branch and .headRefOid == $sha and .mergeCommit.oid != null' \
            <<< "$pr" >/dev/null
          merge_sha="$(jq -r '.mergeCommit.oid' <<< "$pr")"
          echo "Merged release PR $PR_URL at $merge_sha"

          release_run_id=""
          for attempt in $(seq 1 120); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-release.yml \
              --branch main --event workflow_dispatch --limit 30 \
              --json databaseId,headBranch,headSha,createdAt,status,conclusion)"
            release_run_id="$(jq -r --arg sha "$merge_sha" \
              '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | last | .databaseId // empty' \
              <<< "$runs")"
            if [ -n "$release_run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$release_run_id" ]; then
            echo "Release builds workflow did not start for $merge_sha." >&2
            exit 1
          fi
          gh run watch "$release_run_id" --repo "$GITHUB_REPOSITORY" --exit-status --compact

          release_tag="${{ needs.create_release_pr.outputs.release_tag }}"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      # The merged commit carries the verifier; check out exactly that commit so
      # the published assets are judged by the code that built them.
      - name: Check out the merged release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.wait.outputs.merge_sha }}
          persist-credentials: false

      - name: Install release tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling requirements
        run: python -m pip install -r scripts/release-requirements.txt

      - name: Verify the published ZIP files, catalog and signature
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.wait.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.wait.outputs.merge_sha }}
          HANE_UPDATE_KEY_ID: ${{ vars.HANE_UPDATE_KEY_ID }}
          HANE_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.HANE_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python scripts/release_catalog.py fetch-assets \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --dest published-assets
          python scripts/release_catalog.py verify-release \
            --dir published-assets --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
          echo "Release $RELEASE_TAG is published with verified Windows and macOS ZIP files, catalog and signature."

