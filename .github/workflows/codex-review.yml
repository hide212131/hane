name: Codex review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    if: >-
      ${{
        (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/codex-review')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: codex-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write

    steps:
      - name: Resolve and authorize review target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == issue_comment ]]; then
            permission="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/${REPOSITORY}/collaborators/${COMMENT_ACTOR}/permission" \
                --jq '.permission' 2>/dev/null || true
            )"
            case "$permission" in
              admin|maintain|write) ;;
              *)
                echo "::error::/${COMMENT_ACTOR} is not authorized to request a Codex review."
                exit 1
                ;;
            esac
            pr_number="$ISSUE_NUMBER"
          else
            pr_number="$EVENT_PR_NUMBER"
          fi

          pr="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          state="$(jq -r '.state' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"
          target_sha="$(jq -r '.head.sha' <<< "$pr")"

          if [[ "$state" != open || "$draft" != false || -z "$target_sha" || "$target_sha" == null ]]; then
            echo "::error::Pull Request #${pr_number} is not an open, reviewable Pull Request."
            exit 1
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Mark Codex review pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:12}"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context='hane/codex-review' \
            -f description="Codex review pending for ${short_sha}" \
            -f target_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

      - name: Reuse an already completed findings review
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail

          review_id="$(
            gh api --paginate \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --jq ".[] | select(.user.login == \"chatgpt-codex-connector[bot]\" and .commit_id == \"${TARGET_SHA}\") | .id" \
              | tail -n 1
          )"

          if [[ -z "$review_id" ]]; then
            echo 'outcome=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          finding_count="$(
            gh api --paginate \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"chatgpt-codex-connector[bot]\" and .pull_request_review_id == ${review_id}) | .id" \
              | wc -l \
              | tr -d ' '
          )"

          if [[ "$finding_count" -gt 0 ]]; then
            echo 'outcome=findings' >> "$GITHUB_OUTPUT"
            echo "review_id=$review_id" >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish reused findings result
        if: ${{ steps.existing.outputs.outcome == 'findings' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "$current_sha" != "$TARGET_SHA" ]]; then
            echo '::error::Pull Request head changed before the existing Codex result could be accepted.'
            exit 1
          fi

          short_sha="${TARGET_SHA:0:12}"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='hane/codex-review' \
            -f description="Codex findings for ${short_sha}" \
            -f target_url="https://github.com/${REPOSITORY}/pull/${PR_NUMBER}" \
            >/dev/null

      - name: Find or create one Codex request for this SHA
        if: ${{ steps.existing.outputs.outcome == '' }}
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "$current_sha" != "$TARGET_SHA" ]]; then
            echo '::error::Pull Request head changed before Codex review request creation.'
            exit 1
          fi

          marker="<!-- hane-codex-review-request sha=${TARGET_SHA} -->"
          existing="$(
            gh api --paginate \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and ((.body // \"\") | contains(\"${marker}\"))) | [.id, .created_at] | @tsv" \
              | head -n 1
          )"

          if [[ -n "$existing" ]]; then
            request_id="${existing%%$'\t'*}"
            request_created_at="${existing#*$'\t'}"
            echo "Reusing Codex request comment ${request_id} for ${TARGET_SHA}."
          else
            body="$(cat <<EOF
          ${marker}
          @codex review

          Please review the current Pull Request head commit \`${TARGET_SHA}\` as a reviewer only. Check correctness, regressions, missing tests, maintainability, and consistency with Hane's existing design. Do not modify code.
          EOF
          )"
            response="$(
              gh api \
                --method POST \
                "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                -f body="$body"
            )"
            request_id="$(jq -r '.id' <<< "$response")"
            request_created_at="$(jq -r '.created_at' <<< "$response")"
          fi

          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "request_created_at=$request_created_at" >> "$GITHUB_OUTPUT"

      - name: Wait for Codex terminal result
        if: ${{ steps.existing.outputs.outcome == '' }}
        id: result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          REQUEST_CREATED_AT: ${{ steps.request.outputs.request_created_at }}
        run: |
          set -euo pipefail

          short_prefix="${TARGET_SHA:0:10}"
          outcome=''
          evidence_url=''

          for attempt in $(seq 1 50); do
            current_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [[ "$current_sha" != "$TARGET_SHA" ]]; then
              echo "outcome=stale" >> "$GITHUB_OUTPUT"
              echo "Current head moved to ${current_sha}; ignoring all results for ${TARGET_SHA}."
              exit 0
            fi

            review="$(
              gh api --paginate \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
                --jq ".[] | select(.user.login == \"chatgpt-codex-connector[bot]\" and .commit_id == \"${TARGET_SHA}\") | [.id, .html_url] | @tsv" \
                | tail -n 1
            )"
            if [[ -n "$review" ]]; then
              review_id="${review%%$'\t'*}"
              review_url="${review#*$'\t'}"
              finding_count="$(
                gh api --paginate \
                  "repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100" \
                  --jq ".[] | select(.user.login == \"chatgpt-codex-connector[bot]\" and .pull_request_review_id == ${review_id}) | .id" \
                  | wc -l \
                  | tr -d ' '
              )"
              if [[ "$finding_count" -gt 0 ]]; then
                outcome=findings
                evidence_url="$review_url"
                break
              fi
            fi

            clean_url="$(
              gh api --paginate \
                "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
                --jq ".[] | select(
                  .user.login == \"chatgpt-codex-connector[bot]\"
                  and .created_at >= \"${REQUEST_CREATED_AT}\"
                  and ((.body // \"\") | contains(\"Codex Review: Didn't find any major issues\"))
                  and ((.body // \"\") | contains(\"Reviewed commit:** \\\`${short_prefix}\\\`\"))
                ) | .html_url" \
                | tail -n 1
            )"
            if [[ -n "$clean_url" ]]; then
              outcome=clean
              evidence_url="$clean_url"
              break
            fi

            sleep 10
          done

          if [[ -z "$outcome" ]]; then
            outcome=unknown
          fi

          if [[ "$outcome" == clean || "$outcome" == findings ]]; then
            current_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [[ "$current_sha" != "$TARGET_SHA" ]]; then
              outcome=stale
              evidence_url=''
            fi
          fi

          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "evidence_url=$evidence_url" >> "$GITHUB_OUTPUT"

      - name: Publish Codex terminal result
        if: ${{ steps.existing.outputs.outcome == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          OUTCOME: ${{ steps.result.outputs.outcome }}
          EVIDENCE_URL: ${{ steps.result.outputs.evidence_url }}
        run: |
          set -euo pipefail

          short_sha="${TARGET_SHA:0:12}"
          run_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          case "$OUTCOME" in
            clean)
              state=success
              description="Codex review clean for ${short_sha}"
              target_url="${EVIDENCE_URL:-$run_url}"
              ;;
            findings)
              state=failure
              description="Codex findings for ${short_sha}"
              target_url="${EVIDENCE_URL:-$run_url}"
              ;;
            stale)
              state=error
              description="Codex review stale for ${short_sha}"
              target_url="$run_url"
              ;;
            *)
              state=error
              description="Codex review result unknown for ${short_sha}"
              target_url="$run_url"
              ;;
          esac

          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='hane/codex-review' \
            -f description="$description" \
            -f target_url="$target_url" \
            >/dev/null

          if [[ "$OUTCOME" == unknown ]]; then
            gh issue comment "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --body "Codex review for \`${TARGET_SHA}\` did not produce a recognized terminal result. The review remains fail-closed and must not be treated as complete."
            exit 1
          fi
