name: Focused Claude neighbor repair continuation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 102 &&
      github.event.comment.user.login == 'hide212131' &&
      github.event.comment.body == '/claude-fix-focused-neighbor'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: claude-fix-focused-pr-102
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Resolve exact PR head
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${REPOSITORY}/pulls/102")"
          state="$(jq -r '.state' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr")"
          if [[ "$state" != open || "$draft" != false || "$head_repo" != "$REPOSITORY" || -z "$head_ref" || "$head_ref" == main ]]; then
            echo '::error::PR #102 is not an eligible same-repository feature PR.'
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore compatible checkpoint
        id: restore
        shell: bash
        env:
          ORIGINAL_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          echo 'restored=false' >> "$GITHUB_OUTPUT"
          if ! git fetch origin refs/heads/checkpoint/pr-102-focused:refs/remotes/origin/checkpoint/pr-102-focused 2>/dev/null; then
            exit 0
          fi
          checkpoint_sha="$(git rev-parse refs/remotes/origin/checkpoint/pr-102-focused)"
          checkpoint_base="$(git show -s --format=%B "$checkpoint_sha" | sed -n 's/^Hane-Checkpoint-Base: //p' | tail -n 1)"
          checkpoint_finding="$(git show -s --format=%B "$checkpoint_sha" | sed -n 's/^Hane-Checkpoint-Finding: //p' | tail -n 1)"
          if [[ "$checkpoint_base" != "$ORIGINAL_SHA" || "$checkpoint_finding" != 'neighbor-row-target' ]]; then
            echo "Ignoring incompatible checkpoint for base ${checkpoint_base:-unknown}, finding ${checkpoint_finding:-unknown}; current PR head is ${ORIGINAL_SHA}."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$ORIGINAL_SHA" "$checkpoint_sha"; then
            echo 'Ignoring checkpoint that does not descend from its recorded PR head.'
            exit 0
          fi
          if ! git diff --quiet "$ORIGINAL_SHA".."$checkpoint_sha" -- .github/workflows; then
            echo '::warning::Ignoring checkpoint because it changes workflow files.'
            exit 0
          fi
          git checkout --detach "$checkpoint_sha"
          echo "sha=$checkpoint_sha" >> "$GITHUB_OUTPUT"
          echo 'restored=true' >> "$GITHUB_OUTPUT"
          echo "Restored source checkpoint ${checkpoint_sha} for exact base ${ORIGINAL_SHA}."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Repair neighbor row shared parse finding
        id: repair
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/focused-neighbor.txt" <<'EOF'
          You are repairing Hane PR #102. Solve exactly ONE reviewer finding in this invocation.

          FINDING ONLY: On the current PR head, Codex found that the adjacent-block vertical navigation path in `crates/ui/src/view.rs` does not use the cached full joined parse. In particular, `neighbor_row_target` currently reaches `presented_block(..., None)`. For a joinable paragraph over the synchronous parse budget, normal rendering can use `EditorView`'s valid `joined_parse_cache` while this navigation-only layout parses only the first or last visible line. If an emphasis or inline-code delimiter closes far away, marker visibility can therefore differ and the caret can land at a shifted x-position.

          Make the smallest correct change so adjacent-block vertical navigation uses the matching valid cached `JoinedParse` under the same revision/source-range semantics as normal rendering. Add focused regression coverage that exercises the actual navigation path for a paragraph beyond the synchronous line budget with distant delimiters and demonstrates stable caret positioning/marker visibility.

          IMPORTANT: A checkpoint from an interrupted attempt may already be present. Inspect `git diff` and `git log -3` first. Preserve useful existing work and continue from it.

          Work rules:
          - Read AGENTS.md first.
          - Work only on this finding and directly related tests.
          - Do not revisit the already-fixed huge-paragraph architecture, disclosure consistency, or standalone-image continuity except for a tiny compile-enabling adjustment if unavoidable.
          - Run only narrowly relevant tests while implementing; final validation happens later in this workflow.
          - Do not modify `.github/workflows` and do not merge.
          - Stop once this finding and its focused tests are complete.
          EOF
          claude -p --max-turns 100 --permission-mode bypassPermissions < "$RUNNER_TEMP/focused-neighbor.txt"

      - name: Save checkpoint after repair
        if: ${{ always() && !cancelled() && steps.repair.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          checkpoint_dir="$RUNNER_TEMP/checkpoint-neighbor"
          mkdir -p "$checkpoint_dir"
          git status --porcelain=v1 > "$checkpoint_dir/status.txt"
          git rev-parse HEAD > "$checkpoint_dir/head.txt"
          printf '%s\n' "$ORIGINAL_SHA" > "$checkpoint_dir/base.txt"
          git diff --binary "$ORIGINAL_SHA" > "$checkpoint_dir/source.patch"
          git ls-files --others --exclude-standard -z > "$checkpoint_dir/untracked.zlist"
          if [[ -s "$checkpoint_dir/untracked.zlist" ]]; then
            tar --null -T "$checkpoint_dir/untracked.zlist" -czf "$checkpoint_dir/untracked.tar.gz"
          fi
          dirty="$(git status --porcelain=v1)"
          head_sha="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$ORIGINAL_SHA" HEAD \
            && git diff --quiet "$ORIGINAL_SHA"..HEAD -- .github/workflows \
            && git diff --quiet -- .github/workflows \
            && git diff --cached --quiet -- .github/workflows \
            && [[ -z "$(git ls-files --others --exclude-standard -- .github/workflows)" ]] \
            && { [[ "$head_sha" != "$ORIGINAL_SHA" ]] || [[ -n "$dirty" ]]; }; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if [[ -n "$dirty" ]]; then
              git add -A
              git commit -m 'checkpoint: PR 102 neighbor row repair' \
                -m "Hane-Checkpoint-Base: ${ORIGINAL_SHA}" \
                -m 'Hane-Checkpoint-Finding: neighbor-row-target' >/dev/null || true
            else
              git commit --allow-empty -m 'checkpoint: PR 102 neighbor row repair' \
                -m "Hane-Checkpoint-Base: ${ORIGINAL_SHA}" \
                -m 'Hane-Checkpoint-Finding: neighbor-row-target' >/dev/null
            fi
            gh auth setup-git
            git push --force origin HEAD:refs/heads/checkpoint/pr-102-focused || true
          fi
          exit 0

      - name: Upload checkpoint after repair
        if: ${{ always() && !cancelled() && steps.repair.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-102-neighbor-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint-neighbor
          if-no-files-found: warn
          retention-days: 14

      - name: Validate, push, and dispatch validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ORIGINAL_SHA: ${{ steps.target.outputs.sha }}
          HEAD_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$ORIGINAL_SHA" HEAD; then
            echo '::error::Focused repair changed history away from the reviewed PR head.'
            exit 1
          fi
          if ! git diff --quiet "$ORIGINAL_SHA"..HEAD -- .github/workflows \
            || ! git diff --quiet -- .github/workflows \
            || ! git diff --cached --quiet -- .github/workflows \
            || [[ -n "$(git ls-files --others --exclude-standard -- .github/workflows)" ]]; then
            echo '::error::Focused repair attempted to change workflow files.'
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$ORIGINAL_SHA" ]]; then
            git reset --soft "$ORIGINAL_SHA"
          fi
          if [[ -z "$(git status --porcelain=v1)" ]]; then
            echo '::error::Focused repair completed without producing a change.'
            exit 1
          fi

          cargo fmt --all
          cargo test -p hane-ui
          cargo test -p hane-presentation
          cargo clippy -p hane-ui -p hane-presentation --all-targets --all-features -- -D warnings

          current_sha="$(gh api "repos/${REPOSITORY}/pulls/102" --jq '.head.sha')"
          if [[ "$current_sha" != "$ORIGINAL_SHA" ]]; then
            echo "::error::PR #102 moved from ${ORIGINAL_SHA} to ${current_sha}; refusing to push over newer work."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep neighbor row navigation on shared parse'
          new_sha="$(git rev-parse HEAD)"
          gh auth setup-git
          git push origin "HEAD:refs/heads/${HEAD_REF}"

          run_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          generation_id="focused-neighbor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api --method POST "repos/${REPOSITORY}/statuses/${new_sha}" \
            -f state=pending -f context='hane/trusted-ci-generation' \
            -f description="Trusted CI generation ${generation_id}" -f target_url="$run_url" >/dev/null
          for context in 'cargo test / clippy (macos-latest)' 'cargo test / clippy (windows-latest)'; do
            gh api --method POST "repos/${REPOSITORY}/statuses/${new_sha}" \
              -f state=pending -f context="$context" -f description='Trusted CI is queued' -f target_url="$run_url" >/dev/null
          done
          gh workflow run ci.yml --repo "$REPOSITORY" --ref main \
            -f target_sha="$new_sha" -f generation_id="$generation_id"
          gh workflow run codex-review.yml --repo "$REPOSITORY" --ref main \
            -f pr_number=102 -f target_sha="$new_sha"
          gh workflow run gui-requirement.yml --repo "$REPOSITORY" --ref main \
            -f pr_number=102 -f target_sha="$new_sha"

      - name: Report completion
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${REPOSITORY}/issues/102/comments" \
            -f body='隣接ブロック移動時の共有解析に関する focused Claude 修復が完了しました。途中成果は checkpoint 保存済みで、最終コミットに対する trusted CI、Codex review、GUI requirement 判定も起動しました。' >/dev/null
