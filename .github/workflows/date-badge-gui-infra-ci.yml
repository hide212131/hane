name: Date Badge GUI Infra CI

on:
  pull_request:
    paths:
      - '.github/scripts/stage_date_badge_gui_evidence.py'
      - '.github/workflows/aadw-date-badge-gui-validation.yml'
      - '.github/workflows/date-badge-gui-infra-ci.yml'
      - 'scripts/hosted_date_badge_gui.py'
      - 'scripts/hosted_date_badge_gui.swift'
      - 'scripts/tests/test_hosted_date_badge_gui.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            scripts/hosted_date_badge_gui.py \
            .github/scripts/stage_date_badge_gui_evidence.py \
            scripts/tests/test_hosted_date_badge_gui.py
      - name: Run focused validator unit tests
        run: python3 -m unittest scripts/tests/test_hosted_date_badge_gui.py

  swift-helper-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile trusted Vision helper
        run: swiftc scripts/hosted_date_badge_gui.swift -o "$RUNNER_TEMP/date-badge-vision-helper"
