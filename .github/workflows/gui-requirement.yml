name: GUI requirement classification

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request number to classify after a trusted automatic push (for example an automatic Claude fix)
        required: true
        type: string
      target_sha:
        description: Exact head SHA to classify
        required: true
        type: string

permissions:
  contents: read

jobs:
  classify:
    if: >-
      ${{
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.draft == false &&
          (
            (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
            github.event.label.name == 'gui-validation-required'
          )
        ) ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gui-requirement-pr-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      statuses: write

    steps:
      - name: Resolve and authorize classification target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCH_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            pr_number="$DISPATCH_PR_NUMBER"
          else
            pr_number="$EVENT_PR_NUMBER"
          fi

          pr="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          state="$(jq -r '.state' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr")"
          pr_author="$(jq -r '.user.login' <<< "$pr")"

          if [[ "$state" != open || "$draft" != false || -z "$head_sha" || "$head_sha" == null ]]; then
            echo "::error::Pull Request #${pr_number} is not an open, reviewable Pull Request."
            exit 1
          fi

          if [[ "$head_repo" != "$REPOSITORY" ]]; then
            echo "::error::Pull Request #${pr_number} is not a same-repository Pull Request; GUI requirement classification is fail-closed."
            exit 1
          fi

          case "$pr_author" in
            "$REPO_OWNER"|'github-actions[bot]'|'claude[bot]') ;;
            *)
              echo "::error::Pull Request author ${pr_author} is not trusted for automated GUI requirement classification."
              exit 1
              ;;
          esac

          if [[ "$EVENT_NAME" == workflow_dispatch && "$head_sha" != "$DISPATCH_TARGET_SHA" ]]; then
            echo "::error::Pull Request #${pr_number} head ${head_sha} no longer matches requested classification target ${DISPATCH_TARGET_SHA}; refusing stale request."
            exit 1
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "target_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Classify GUI requirement from labels and changed files
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail

          # policy v1 no-GUI allowlist: documentation and CI/automation-only files that
          # cannot change Hane's compiled desktop runtime. Everything else, and any
          # unrecognized or missing evidence, fails closed to required = true.
          is_no_gui_path() {
            local path="$1"
            case "$path" in
              docs/*|.github/*) return 0 ;;
            esac
            if [[ "$path" != */* && "$path" == *.md ]]; then
              return 0
            fi
            return 1
          }

          label_present="$(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.labels[].name] | any(. == "gui-validation-required")'
          )"

          if [[ "$label_present" == true ]]; then
            echo "gui-validation-required is present on #${PR_NUMBER}; forcing required = true."
            echo 'decision=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          files="$(
            gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[].filename' 2>/tmp/gui-requirement-files.err
          )"
          files_status=$?
          set -e

          if [[ "$files_status" -ne 0 ]]; then
            echo "::warning::Failed to list changed files for #${PR_NUMBER}: $(cat /tmp/gui-requirement-files.err)"
            echo 'decision=blocked' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$files" ]]; then
            echo "No changed files were reported for #${PR_NUMBER}; failing closed to required = true."
            echo 'decision=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          all_allowlisted=true
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if ! is_no_gui_path "$path"; then
              all_allowlisted=false
              break
            fi
          done <<< "$files"

          if [[ "$all_allowlisted" == true ]]; then
            echo 'decision=false' >> "$GITHUB_OUTPUT"
          else
            echo 'decision=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Re-fetch current head before publishing
        id: recheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "$current_sha" == "$TARGET_SHA" ]]; then
            echo 'stale=false' >> "$GITHUB_OUTPUT"
          else
            echo 'stale=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GUI requirement classification
        if: ${{ steps.recheck.outputs.stale == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          DECISION: ${{ steps.classify.outputs.decision }}
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:12}"
          run_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          case "$DECISION" in
            true)
              state=failure
              description="GUI validation required (v1) for ${short_sha}"
              ;;
            false)
              state=success
              description="GUI validation not required (v1) for ${short_sha}"
              ;;
            *)
              state=error
              description="GUI requirement classification blocked for ${short_sha} (v1)"
              ;;
          esac

          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='hane/gui-requirement' \
            -f description="$description" \
            -f target_url="$run_url" \
            >/dev/null

      - name: Publish stale classification result
        if: ${{ steps.recheck.outputs.stale == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:12}"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=error \
            -f context='hane/gui-requirement' \
            -f description="GUI requirement classification stale for ${short_sha} (v1)" \
            -f target_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
          echo "::warning::Pull Request head moved before the GUI requirement classification could be published."

      - name: Mark controller failure as blocked
        if: ${{ failure() && steps.target.outputs.target_sha != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:12}"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=error \
            -f context='hane/gui-requirement' \
            -f description="GUI requirement classification controller failed for ${short_sha} (v1)" \
            -f target_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
