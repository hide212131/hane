name: PR416 current-main GUI diagnostic baseline
run-name: PR416 baseline 3f738b5 comparison with 37266328180
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  baseline:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out pinned trusted control
        uses: actions/checkout@v6
        with:
          ref: 3f738b57d033689832183469e1751248530f204d
          path: control
          persist-credentials: false
      - name: Check out pinned current-main baseline
        uses: actions/checkout@v6
        with:
          ref: 3f738b57d033689832183469e1751248530f204d
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current PR head and baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = 3f738b57d033689832183469e1751248530f204d
          test "$(git -C baseline rev-parse HEAD)" = 3f738b57d033689832183469e1751248530f204d
          test -z "$(git -C baseline status --porcelain)"
          gh api repos/hide212131/hane/pulls/416 > "$RUNNER_TEMP/pr-context.json"
          jq -e '.state == "open" and .head.sha == "49b4a377cd4d62e21adb01f6a338c817351bd562" and .base.sha == "3f738b57d033689832183469e1751248530f204d"' "$RUNNER_TEMP/pr-context.json"
          test "$(gh api repos/hide212131/hane/branches/main --jq '.commit.sha')" = 3f738b57d033689832183469e1751248530f204d
          echo 'Read-only diagnostic baseline. This run does not waive or replace the original candidate GUI result.'
      - name: Execute unchanged trusted GUI procedure on baseline
        env:
          HANE_GUI_INTERACTION_TARGET_DIR: ${{ github.workspace }}/baseline
          HANE_GUI_INTERACTION_CONTROL_DIR: ${{ github.workspace }}/control
          HANE_GUI_INTERACTION_EXPECTED_SHA: 3f738b57d033689832183469e1751248530f204d
          HANE_GUI_INTERACTION_RUN_DIR: ${{ runner.temp }}/hane-gui-interaction
          HANE_GUI_INTERACTION_REQUEST_ID: pr416-baseline-${{ github.run_id }}
        run: python3 control/scripts/hosted_gui_interaction.py
      - name: Stage allowlisted diagnostic evidence
        if: always()
        run: python3 -I control/.github/scripts/stage_gui_evidence.py
      - name: Upload current-main baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr416-current-main-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/hane-gui-artifact
          if-no-files-found: error
          retention-days: 14
