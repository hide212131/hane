name: AI authentication smoke test

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Authentication path to test
        required: true
        default: all
        type: choice
        options:
          - all
          - claude
          - copilot

permissions:
  contents: read

jobs:
  claude:
    if: ${{ inputs.engine == 'claude' || inputs.engine == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    steps:
      - name: Check Claude OAuth secret
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "::error::Repository secret CLAUDE_CODE_OAUTH_TOKEN is not configured."
            exit 1
          fi

      - name: Verify Claude authentication
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            This is an authentication smoke test only.
            Do not modify files, create commits, or perform GitHub write operations.
            Respond with exactly: CLAUDE_AUTH_OK
          claude_args: |
            --max-turns 1

  copilot:
    if: ${{ inputs.engine == 'copilot' || inputs.engine == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Copilot PAT secret
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            echo "::error::Repository secret COPILOT_GITHUB_TOKEN is not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify Copilot authentication
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output="$(copilot -p 'Respond with exactly: COPILOT_AUTH_OK. Do not use tools.' --no-ask-user)"
          printf '%s\n' "$output"
          if ! grep -q 'COPILOT_AUTH_OK' <<<"$output"; then
            echo "::error::Copilot inference completed without the expected smoke-test marker."
            exit 1
          fi

# This workflow intentionally tests the production authentication choices documented
# in docs/agentic-development-workflow.md. It does not test Codex because PR #49
# already exercised the ChatGPT Codex GitHub integration repeatedly.
