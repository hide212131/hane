name: PR 82 notification permission comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: Post a bounded diagnostic notification to PR 82
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VARIANT: control
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="PR #82 notification verification (${VARIANT}). This is a diagnostic comment from the workflow token; no Claude execution occurred. Run: ${run_url}"
          set +e
          gh api --include --method POST "repos/${REPOSITORY}/issues/82/comments" \
            -f body="$body" > "$RUNNER_TEMP/notification-response.txt" 2> "$RUNNER_TEMP/notification-error.txt"
          result=$?
          set -e
          # Response headers/body contain the public test comment, never request credentials.
          cat "$RUNNER_TEMP/notification-response.txt"
          cat "$RUNNER_TEMP/notification-error.txt"
          {
            echo "Variant: ${VARIANT}"
            echo "API exit code: ${result}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$VARIANT" == candidate && "$result" -ne 0 ]]; then
            exit "$result"
          fi

  candidate:
    needs: control
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Post a bounded diagnostic notification to PR 82
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VARIANT: candidate
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="PR #82 notification verification (${VARIANT}). This is a diagnostic comment from the workflow token; no Claude execution occurred. Run: ${run_url}"
          set +e
          gh api --include --method POST "repos/${REPOSITORY}/issues/82/comments" \
            -f body="$body" > "$RUNNER_TEMP/notification-response.txt" 2> "$RUNNER_TEMP/notification-error.txt"
          result=$?
          set -e
          # Response headers/body contain the public test comment, never request credentials.
          cat "$RUNNER_TEMP/notification-response.txt"
          cat "$RUNNER_TEMP/notification-error.txt"
          {
            echo "Variant: ${VARIANT}"
            echo "API exit code: ${result}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$VARIANT" == candidate && "$result" -ne 0 ]]; then
            exit "$result"
          fi
