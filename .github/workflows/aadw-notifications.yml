name: AADW lifecycle notifications

on:
  repository_dispatch:
    types: [claude-progress-start]
  issue_comment:
    types: [created]
  workflow_run:
    workflows:
      - Implement issue with Claude
      - Codex review gate
      - Codex limit Copilot review fallback
      - Copilot pre-GUI routing
      - Claude automatic fix worker
      - GUI requirement classification
      - GUI validation
      - Copilot final judgement
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    steps:
      - name: Check out trusted AADW notification code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Ignore workflow runs that did not execute an AADW process
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          decision="$(python3 -I .github/scripts/aadw_workflow_run_gate.py)"
          echo "run=${decision}" >> "$GITHUB_OUTPUT"

      - name: Mirror AADW lifecycle to Issue / PR Conversation
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/aadw_observer.py

      - name: Close pending lifecycle on prior heads after source workflow completion
        if: ${{ always() && github.event_name == 'workflow_run' && steps.gate.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/aadw_workflow_completion_reconcile.py

      - name: Close Copilot fallback lifecycle after workflow completion
        if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Codex limit Copilot review fallback' && steps.gate.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/aadw_fallback_completion_reconcile.py
