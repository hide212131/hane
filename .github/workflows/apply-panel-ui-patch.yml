name: Apply panel UI patch

on:
  push:
    branches:
      - ui/resizable-panels-scrollbars

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/resizable-panels-scrollbars

      - name: Apply panel changes
        run: python3 scripts/apply-panel-ui-patch.py

      - name: Format
        run: cargo fmt --all

      - name: Test UI crate
        run: cargo test -p hane-ui --locked

      - name: Clippy UI crate
        run: cargo clippy -p hane-ui --all-targets --locked -- -D warnings

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/apply-panel-ui-patch.yml scripts/apply-panel-ui-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ui/src/view.rs crates/ui/src/icons.rs assets/icons/work-folder/chevron-right.svg assets/icons/work-folder/chevron-down.svg .github/workflows/apply-panel-ui-patch.yml scripts/apply-panel-ui-patch.py
          git commit -m "feat(ui): resize panels and add visible scrollbars"
          git push origin HEAD:ui/resizable-panels-scrollbars
