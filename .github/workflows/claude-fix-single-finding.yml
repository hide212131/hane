name: Claude single finding repair

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 102 &&
      github.event.comment.user.login == 'hide212131' &&
      (github.event.comment.body == '/claude-fix-byte-bound' ||
       github.event.comment.body == '/claude-fix-shared-one-line' ||
       github.event.comment.body == '/claude-fix-quote-markers' ||
       github.event.comment.body == '/claude-fix-adjacent-layout')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: claude-single-finding-pr-102
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Resolve exact PR head
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${REPOSITORY}/pulls/102")"
          state="$(jq -r '.state' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr")"
          if [[ "$state" != open || "$draft" != false || "$head_repo" != "$REPOSITORY" || -z "$head_ref" || "$head_ref" == main ]]; then
            echo '::error::PR #102 is not an eligible same-repository feature PR.'
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Select one finding
        id: task
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            /claude-fix-byte-bound)
              finding='byte-bound'
              ;;
            /claude-fix-shared-one-line)
              finding='shared-one-line'
              ;;
            /claude-fix-quote-markers)
              finding='quote-markers'
              ;;
            /claude-fix-adjacent-layout)
              finding='adjacent-layout'
              ;;
            *)
              echo '::error::Unsupported finding command.'
              exit 1
              ;;
          esac
          echo "finding=$finding" >> "$GITHUB_OUTPUT"

      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore compatible checkpoint for this finding
        shell: bash
        env:
          ORIGINAL_SHA: ${{ steps.target.outputs.sha }}
          FINDING: ${{ steps.task.outputs.finding }}
        run: |
          set -euo pipefail
          if ! git fetch origin refs/heads/checkpoint/pr-102-single:refs/remotes/origin/checkpoint/pr-102-single 2>/dev/null; then
            exit 0
          fi
          checkpoint_sha="$(git rev-parse refs/remotes/origin/checkpoint/pr-102-single)"
          checkpoint_message="$(git show -s --format=%B "$checkpoint_sha")"
          checkpoint_base="$(sed -n 's/^Hane-Checkpoint-Base: //p' <<< "$checkpoint_message" | tail -n 1)"
          checkpoint_finding="$(sed -n 's/^Hane-Checkpoint-Finding: //p' <<< "$checkpoint_message" | tail -n 1)"
          if [[ "$checkpoint_base" != "$ORIGINAL_SHA" || "$checkpoint_finding" != "$FINDING" ]]; then
            echo 'Ignoring checkpoint created for a different exact head or finding.'
            exit 0
          fi
          if ! git merge-base --is-ancestor "$ORIGINAL_SHA" "$checkpoint_sha"; then
            echo 'Ignoring checkpoint that does not descend from its recorded PR head.'
            exit 0
          fi
          if ! git diff --quiet "$ORIGINAL_SHA".."$checkpoint_sha" -- .github/workflows; then
            echo '::warning::Ignoring checkpoint because it changes workflow files.'
            exit 0
          fi
          git checkout --detach "$checkpoint_sha"
          echo "Restored checkpoint ${checkpoint_sha} for ${FINDING}."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Prepare finding prompt
        id: prompt
        shell: bash
        env:
          FINDING: ${{ steps.task.outputs.finding }}
        run: |
          set -euo pipefail
          case "$FINDING" in
            byte-bound)
              cat > "$RUNNER_TEMP/finding.txt" <<'EOF'
          You are repairing Hane PR #102. Solve exactly ONE current Codex finding.

          FINDING ONLY: In crates/ui/src/line.rs around the block-context decision, synchronous full-block work is bounded only by physical line count. A joinable block with fewer than 4,096 lines can still be enormous in bytes (for example about 4,000 lines times 25 KB, roughly 100 MB), causing viewport rendering and disclosure/currentness checks to copy and synchronously parse huge source. Add a byte-size bound as well as the existing line-count bound, and route blocks exceeding either bound to the existing background/cached JoinedParse path. Keep render-time source work bounded. Add focused regression coverage for a low-line-count, huge-byte block.

          Do not work on one-line shared parse, nested quote markers, adjacent-block caret movement, or unrelated findings. Read AGENTS.md. Inspect the current diff/history first. Make the smallest correct fix, run only focused tests while implementing, do not modify .github/workflows, and stop when this finding and its tests are complete.
          EOF
              ;;
            shared-one-line)
              cat > "$RUNNER_TEMP/finding.txt" <<'EOF'
          You are repairing Hane PR #102. Solve exactly ONE current Codex finding.

          FINDING ONLY: In crates/presentation/src/lib.rs around present_window/present_joined_run, a joinable block with a supplied cached whole-block JoinedParse must use that shared parse even when the current viewport/run contains only ONE physical line. Today a `window.lines.len() > 1` style condition can fall back to single-line parsing and make **, _, or inline-code rendering depend on how many physical lines happen to be visible. Use the cached shared whole-block parse for a one-line run too, while still rendering only the requested line. Add a focused regression test where the matching delimiter is outside the one-line viewport.

          Do not work on byte-size bounds, nested quote markers, adjacent-block caret movement, or unrelated findings. Read AGENTS.md. Inspect the current diff/history first. Make the smallest correct fix, run only focused tests while implementing, do not modify .github/workflows, and stop when this finding and its tests are complete.
          EOF
              ;;
            quote-markers)
              cat > "$RUNNER_TEMP/finding.txt" <<'EOF'
          You are repairing Hane PR #102. Solve exactly ONE current Codex finding.

          FINDING ONLY: In crates/markdown/src/lib.rs around nested blockquote marker derivation, multi-line nested quotes such as `> > first\n> > second` derive the inner Quote marker on later physical lines from an offset that belongs to the first line. This can hide/merge the outer marker while leaving the inner `>` visible, producing `> second`. Derive marker positions independently from each physical line start and quote depth so all nested quote markers are identified correctly on later lines. Add focused regression coverage for at least a two-line nested blockquote.

          Do not work on byte-size bounds, one-line shared parse, adjacent-block caret movement, or unrelated findings. Read AGENTS.md. Inspect the current diff/history first. Make the smallest correct fix, run only focused tests while implementing, do not modify .github/workflows, and stop when this finding and its tests are complete.
          EOF
              ;;
            adjacent-layout)
              cat > "$RUNNER_TEMP/finding.txt" <<'EOF'
          You are repairing Hane PR #102. Solve exactly ONE current Codex finding.

          FINDING ONLY: In crates/ui/src/view.rs around vertical caret movement into an adjacent block, the layout path passes no JoinedParse even when EditorView already holds a valid cached whole-block parse for a large joinable block. The first/last line is then parsed by itself, so hidden Markdown markers may become visible only during movement and the x-coordinate-to-caret mapping shifts. Pass the matching cached JoinedParse into this adjacent-block movement/layout path so caret landing uses the same presentation as normal rendering. Add a focused regression test for movement into a large joinable block whose delimiter pair spans far beyond the boundary line.

          Do not work on byte-size bounds, one-line shared parse, nested quote markers, or unrelated findings. Read AGENTS.md. Inspect the current diff/history first. Make the smallest correct fix, run only focused tests while implementing, do not modify .github/workflows, and stop when this finding and its tests are complete.
          EOF
              ;;
          esac

      - name: Repair selected finding
        id: repair
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p --max-turns 160 --permission-mode bypassPermissions < "$RUNNER_TEMP/finding.txt"

      - name: Save checkpoint after Claude
        if: ${{ always() && !cancelled() && steps.repair.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_SHA: ${{ steps.target.outputs.sha }}
          FINDING: ${{ steps.task.outputs.finding }}
        run: |
          set +e
          checkpoint_dir="$RUNNER_TEMP/checkpoint"
          mkdir -p "$checkpoint_dir"
          git status --porcelain=v1 > "$checkpoint_dir/status.txt"
          git rev-parse HEAD > "$checkpoint_dir/head.txt"
          printf '%s\n' "$ORIGINAL_SHA" > "$checkpoint_dir/base.txt"
          printf '%s\n' "$FINDING" > "$checkpoint_dir/finding.txt"
          git diff --binary "$ORIGINAL_SHA" > "$checkpoint_dir/source.patch"
          git ls-files --others --exclude-standard -z > "$checkpoint_dir/untracked.zlist"
          if [[ -s "$checkpoint_dir/untracked.zlist" ]]; then
            tar --null -T "$checkpoint_dir/untracked.zlist" -czf "$checkpoint_dir/untracked.tar.gz"
          fi
          dirty="$(git status --porcelain=v1)"
          head_sha="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$ORIGINAL_SHA" HEAD \
            && git diff --quiet "$ORIGINAL_SHA"..HEAD -- .github/workflows \
            && git diff --quiet -- .github/workflows \
            && git diff --cached --quiet -- .github/workflows \
            && [[ -z "$(git ls-files --others --exclude-standard -- .github/workflows)" ]] \
            && { [[ "$head_sha" != "$ORIGINAL_SHA" ]] || [[ -n "$dirty" ]]; }; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if [[ -n "$dirty" ]]; then
              git add -A
              git commit -m "checkpoint: PR 102 ${FINDING}" \
                -m "Hane-Checkpoint-Base: ${ORIGINAL_SHA}" \
                -m "Hane-Checkpoint-Finding: ${FINDING}" >/dev/null || true
            else
              git commit --allow-empty -m "checkpoint: PR 102 ${FINDING}" \
                -m "Hane-Checkpoint-Base: ${ORIGINAL_SHA}" \
                -m "Hane-Checkpoint-Finding: ${FINDING}" >/dev/null
            fi
            gh auth setup-git
            git push --force origin HEAD:refs/heads/checkpoint/pr-102-single || true
          fi
          exit 0

      - name: Upload checkpoint after Claude
        if: ${{ always() && !cancelled() && steps.repair.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-102-${{ steps.task.outputs.finding }}-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint
          if-no-files-found: warn
          retention-days: 14

      - name: Validate, push, and dispatch validation
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ORIGINAL_SHA: ${{ steps.target.outputs.sha }}
          HEAD_REF: ${{ steps.target.outputs.ref }}
          FINDING: ${{ steps.task.outputs.finding }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$ORIGINAL_SHA" HEAD; then
            echo '::error::Claude repair changed history away from the reviewed PR head.'
            exit 1
          fi
          if ! git diff --quiet "$ORIGINAL_SHA"..HEAD -- .github/workflows \
            || ! git diff --quiet -- .github/workflows \
            || ! git diff --cached --quiet -- .github/workflows \
            || [[ -n "$(git ls-files --others --exclude-standard -- .github/workflows)" ]]; then
            echo '::error::Claude repair attempted to change workflow files.'
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$ORIGINAL_SHA" ]]; then
            git reset --soft "$ORIGINAL_SHA"
          fi
          if [[ -z "$(git status --porcelain=v1)" ]]; then
            echo '::error::Claude repair completed without producing a change.'
            exit 1
          fi

          cargo fmt --all
          cargo test -p hane-markdown
          cargo test -p hane-presentation
          cargo test -p hane-ui
          cargo clippy -p hane-markdown -p hane-presentation -p hane-ui --all-targets --all-features -- -D warnings

          current_sha="$(gh api "repos/${REPOSITORY}/pulls/102" --jq '.head.sha')"
          if [[ "$current_sha" != "$ORIGINAL_SHA" ]]; then
            echo "::error::PR #102 moved from ${ORIGINAL_SHA} to ${current_sha}; refusing to push over newer work."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "fix: resolve ${FINDING} review finding"
          new_sha="$(git rev-parse HEAD)"
          gh auth setup-git
          git push origin "HEAD:refs/heads/${HEAD_REF}"

          run_url="https://github.com/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          generation_id="single-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api --method POST "repos/${REPOSITORY}/statuses/${new_sha}" \
            -f state=pending -f context='hane/trusted-ci-generation' \
            -f description="Trusted CI generation ${generation_id}" -f target_url="$run_url" >/dev/null
          for context in 'cargo test / clippy (macos-latest)' 'cargo test / clippy (windows-latest)'; do
            gh api --method POST "repos/${REPOSITORY}/statuses/${new_sha}" \
              -f state=pending -f context="$context" -f description='Trusted CI is queued' -f target_url="$run_url" >/dev/null
          done
          gh workflow run ci.yml --repo "$REPOSITORY" --ref main \
            -f target_sha="$new_sha" -f generation_id="$generation_id"
          gh workflow run codex-review.yml --repo "$REPOSITORY" --ref main \
            -f pr_number=102 -f target_sha="$new_sha"
          gh workflow run gui-requirement.yml --repo "$REPOSITORY" --ref main \
            -f pr_number=102 -f target_sha="$new_sha"

      - name: Report completion
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FINDING: ${{ steps.task.outputs.finding }}
        run: |
          gh api --method POST "repos/${REPOSITORY}/issues/102/comments" \
            -f body="Claude による ${FINDING} の修復が完了しました。途中成果は checkpoint 保存済みで、新しい head に対する trusted CI、Codex review、GUI requirement 判定を起動しました。" >/dev/null
