name: Release builds

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (例: v0.8.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "Manual releases must be run from the main branch." >&2
              exit 1
            fi
            release_tag="$INPUT_VERSION"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if ! [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $release_tag" >&2
            echo "Expected format: v0.8.0" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              echo "Tag already exists: $release_tag" >&2
              exit 1
            fi

            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$release_tag" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build hane-windows-x64
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p hane

      - name: Package portable zip
        shell: pwsh
        run: |
          $staging = "staging/hane-windows-x64"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item target/release/hane.exe "$staging/hane.exe"
          Copy-Item README.md "$staging/README.md"
          Copy-Item LICENSE "$staging/LICENSE" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$staging/*" -DestinationPath "hane-windows-x64.zip" -Force

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v6
        with:
          name: hane-windows-x64
          path: hane-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build hane-macos-arm64
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p hane

      - name: Package portable zip
        shell: bash
        run: |
          set -euo pipefail
          staging="staging/hane-macos-arm64"
          mkdir -p "$staging"
          cp target/release/hane "$staging/hane"
          chmod +x "$staging/hane"
          cp README.md "$staging/README.md"
          if [ -f LICENSE ]; then
            cp LICENSE "$staging/LICENSE"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$staging" "hane-macos-arm64.zip"

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v6
        with:
          name: hane-macos-arm64
          path: hane-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs:
      - prepare
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v7
        with:
          name: hane-windows-x64
          path: release-assets

      - name: Download macOS Apple Silicon build artifact
        uses: actions/download-artifact@v7
        with:
          name: hane-macos-arm64
          path: release-assets

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
