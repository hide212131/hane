name: Release builds

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - Cargo.toml
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (例: v0.8.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-builds
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "hane") | .version')"
          manifest_tag="v$cargo_version"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "Manual releases must be run from the main branch." >&2
              exit 1
            fi
            release_tag="$INPUT_VERSION"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$manifest_tag"
          fi

          if ! [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $release_tag" >&2
            echo "Expected format: v0.8.0" >&2
            exit 1
          fi

          if [ "$release_tag" != "$manifest_tag" ]; then
            echo "Release version $release_tag does not match Cargo package version $cargo_version." >&2
            exit 1
          fi

          tag_exists=false
          latest_tag=""
          if [ "${{ github.ref_type }}" != "tag" ]; then
            tag_names_file="$(mktemp)"
            trap 'rm -f "$tag_names_file"' EXIT
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
              --jq '.[].name' > "$tag_names_file"; then
              echo "Failed to read repository tags; refusing to release." >&2
              exit 1
            fi

            if grep -Fxq -- "$release_tag" "$tag_names_file"; then
              tag_exists=true
            fi
            latest_tag="$(
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' "$tag_names_file" |
                sort -V |
                tail -n 1 || true
            )"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$tag_exists" = true ]; then
            echo "Tag already exists: $release_tag" >&2
            exit 1
          fi

          should_release=true
          if [ "${{ github.event_name }}" = "push" ] && \
             [ "${{ github.ref_type }}" = "branch" ] && \
             [ "$tag_exists" = true ]; then
            echo "Cargo version $cargo_version is already released as $release_tag; skipping."
            should_release=false
          fi

          if [ "$should_release" = true ] && [ "${{ github.ref_type }}" != "tag" ]; then
            if [ -n "$latest_tag" ] && [ "$(printf '%s\n%s\n' "$latest_tag" "$release_tag" | sort -V | tail -n 1)" != "$release_tag" ]; then
              echo "Release version $release_tag must be newer than latest tag $latest_tag." >&2
              exit 1
            fi
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build hane-windows-x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p hane

      - name: Package portable zip
        shell: pwsh
        run: |
          $staging = "staging/hane-windows-x64"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item target/release/hane.exe "$staging/hane.exe"
          Copy-Item README.md "$staging/README.md"
          Copy-Item LICENSE "$staging/LICENSE" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$staging/*" -DestinationPath "hane-windows-x64.zip" -Force

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v6
        with:
          name: hane-windows-x64
          path: hane-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build hane-macos-arm64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p hane

      - name: Package portable zip
        shell: bash
        run: |
          set -euo pipefail
          staging="staging/hane-macos-arm64"
          mkdir -p "$staging"
          cp target/release/hane "$staging/hane"
          chmod +x "$staging/hane"
          cp README.md "$staging/README.md"
          if [ -f LICENSE ]; then
            cp LICENSE "$staging/LICENSE"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$staging" "hane-macos-arm64.zip"

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v6
        with:
          name: hane-macos-arm64
          path: hane-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs:
      - prepare
      - build-windows
      - build-macos
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v7
        with:
          name: hane-windows-x64
          path: release-assets

      - name: Download macOS Apple Silicon build artifact
        uses: actions/download-artifact@v7
        with:
          name: hane-macos-arm64
          path: release-assets

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            create_args=(
              "$RELEASE_TAG"
              release-assets/*.zip
              --generate-notes
              --title "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
            )

            if [ "${{ github.ref_type }}" != "tag" ]; then
              create_args+=(--target "$GITHUB_SHA")
            fi

            gh release create "${create_args[@]}"
          fi
