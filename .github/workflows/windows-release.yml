name: Windows release build

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build hane-windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p hane

      - name: Package portable zip
        shell: pwsh
        run: |
          $staging = "staging/hane-windows-x64"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item target/release/hane.exe "$staging/hane.exe"
          Copy-Item README.md "$staging/README.md"
          Copy-Item LICENSE "$staging/LICENSE" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$staging/*" -DestinationPath "hane-windows-x64.zip" -Force

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v6
        with:
          name: hane-windows-x64
          path: hane-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish Windows release asset
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v7
        with:
          name: hane-windows-x64

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" hane-windows-x64.zip \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" hane-windows-x64.zip \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
