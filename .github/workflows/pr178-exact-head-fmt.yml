name: PR178 Exact Head Fmt Validation

on:
  push:
    branches:
      - tmp-pr178-sync-check

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: 1454de3f923ea6ad4d324829df75d0c7a0ae509d
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1454de3f923ea6ad4d324829df75d0c7a0ae509d"
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
