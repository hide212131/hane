name: PR178 Exact Head Fmt Validation

on:
  push:
    branches:
      - tmp-pr178-sync-check

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: 60dca43c0a2f14c86ac233eef97c08cbbb00eb58
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "60dca43c0a2f14c86ac233eef97c08cbbb00eb58"
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
