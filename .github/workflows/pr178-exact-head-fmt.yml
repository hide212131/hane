name: PR178 Exact Head Fmt Validation

on:
  push:
    branches:
      - tmp-pr178-sync-check

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: 6862e5820c42ffaf836e924a7f67291af77923bb
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6862e5820c42ffaf836e924a7f67291af77923bb"
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
