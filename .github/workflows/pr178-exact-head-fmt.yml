name: PR178 Exact Head Fmt Validation

on:
  push:
    branches:
      - tmp-pr178-sync-check

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: 55673ca5f584b05990f2656a948f156f5e5be36d
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "55673ca5f584b05990f2656a948f156f5e5be36d"
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
