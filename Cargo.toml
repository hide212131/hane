[workspace]
members = [
    "crates/app",
    "crates/benchmark",
    "crates/document",
    "crates/editor",
    "crates/markdown",
    "crates/metrics",
    "crates/presentation",
    "crates/session",
    "crates/ui",
]
resolver = "2"
exclude = ["vendor/gpui", "vendor/gpui-pre-macos"]

[workspace.package]
version = "0.19.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.1"

[workspace.dependencies]
hane-document = { path = "crates/document" }
hane-editor = { path = "crates/editor" }
hane-markdown = { path = "crates/markdown" }
hane-metrics = { path = "crates/metrics" }
hane-presentation = { path = "crates/presentation" }
hane-session = { path = "crates/session" }
hane-benchmark = { path = "crates/benchmark" }
hane-ui = { path = "crates/ui" }
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["runtime_shaders", "font-kit", "wayland", "x11"] }
gpui-component = { version = "=0.6.6", default-features = false }
gpui-kit-assets = { version = "=0.6.6" }
libc = "=0.2.189"
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "=1.12.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

# CommonMark 0.31.2 ATX closing whitespace fix; see vendor/pulldown-cmark/HANE-PATCH.md.
[patch.crates-io]
pulldown-cmark = { path = "vendor/pulldown-cmark" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
