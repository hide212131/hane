<text x="36" y="878" class="panel-label">配置の約束</text>
<text x="36" y="909" class="body-note">1. OSボタン・ファイルメニュー・移動用余白を押し出さず、タブ列だけを横にスクロールします。</text>
<text x="36" y="940" class="body-note">2. 上部40pxは一度だけ確保します。サイドバーと設定画面の内容高は「画面高 − 40px」です。</text>
<text x="36" y="971" class="body-note">3. 移動用余白を48px以上残します。タブ・メニュー・OSボタンはウインドウ移動の領域にしません。</text>
