<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Hane 統合タイトルバーの配置設計 — Issue #542</title>
<desc id="desc">設計図、未実装。macOSとWindowsのライト・ダークを4パネルで比較する。タイトルバーは論理40pxで一度だけ確保し、サイドバーと本文をその下に置く。macOSの左80pxは標準の3ボタンを予約する。Windowsは左12px、右35pxの3ボタン、合計105pxを予約する。ファイルメニューと既存タブを配置し、48px以上の移動用余白を残す。固定領域を押し出さず、タブ列だけが横スクロールする。設定画面ではタブ列に代えて設定と表示し、ウインドウ操作は保つ。</desc>
