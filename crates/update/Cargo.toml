[package]
name = "hane-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Test signing key, fake transport/clock/filesystem and ZIP fixture builders.
# Never enabled for product builds; the unit tests always compile them in.
test-support = []

# Dependencies are limited to crates already resolved in Cargo.lock for other
# workspace members (ring via rustls, flate2 via png). GPUI, document body and
# AI credential/runtime crates are intentionally not dependencies.
[dependencies]
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url.workspace = true
# Only the reserved OS secret store service name of proxy credentials; the
# crate has no dependencies of its own.
hane-network.workspace = true

# Temporary OS secret store of the proxy userinfo that crosses a restart
# (Keychain / Credential Manager). The same crate and version the AI credential
# store uses; no secret-service backend is pulled in on other platforms.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "2"
# Raw CoreFoundation types for the Keychain access list (secret_store.rs); already
# resolved in Cargo.lock.
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "2"

# OS adapters. Both crates are already resolved in Cargo.lock for other
# workspace members; each is used for read-only volume queries only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
