[package]
name = "hane-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Test signing key, fake transport/clock/filesystem and ZIP fixture builders.
# Never enabled for product builds; the unit tests always compile them in.
test-support = []

# Dependencies are limited to crates already resolved in Cargo.lock for other
# workspace members (ring via rustls, flate2 via png). GPUI, document body and
# AI credential/runtime crates are intentionally not dependencies.
[dependencies]
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url.workspace = true
