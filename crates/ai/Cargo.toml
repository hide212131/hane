[package]
name = "hane-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes test-only seams (local fixture routing for the curl downloader) to
# other crates' tests. Never enabled in a normal build.
test-support = []

[dependencies]
hane-network.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# OS credential store backend for Custom Provider API keys (macOS Keychain /
# Windows Credential Manager). Deliberately not pulled in on any other
# target, so `OsCredentialStore` there stays an explicit
# `CredentialStoreError::Unavailable` rather than depending on a Linux
# secret-service/keyutils backend this crate does not otherwise need.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "2"

[dev-dependencies]
toml = "0.8"
