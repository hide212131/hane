[package]
name = "hane"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
instrument = [
    "dep:hane-markdown",
    "dep:hane-metrics",
    "dep:hane-presentation",
    "hane-ui/instrument",
]

[dependencies]
hane-document.workspace = true
hane-editor.workspace = true
hane-markdown = { workspace = true, optional = true }
hane-metrics = { workspace = true, optional = true }
hane-presentation = { workspace = true, optional = true }
hane-ui.workspace = true
gpui.workspace = true
