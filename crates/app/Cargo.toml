[package]
name = "hane"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
timing-probe = ["hane-ui/timing-probe"]
instrument = [
    "dep:hane-document",
    "dep:hane-markdown",
    "dep:hane-metrics",
    "dep:hane-presentation",
    "hane-ui/instrument",
]

[dependencies]
hane-document = { workspace = true, optional = true }
hane-editor.workspace = true
hane-markdown = { workspace = true, optional = true }
hane-metrics = { workspace = true, optional = true }
hane-presentation = { workspace = true, optional = true }
hane-session.workspace = true
hane-ui.workspace = true
gpui.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO"] }

[[example]]
name = "gpui_baseline"
required-features = ["instrument"]
