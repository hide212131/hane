[package]
name = "hane"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
timing-probe = ["hane-ui/timing-probe"]
# Isolated update validation build (Issue #510): the update check reads from a
# loopback fixture feed instead of GitHub. Never part of the default, `debug` or
# `release` builds of the product; see https_transport/validation_feed.rs.
validation-feed = []
instrument = [
    "dep:hane-document",
    "dep:hane-markdown",
    "dep:hane-metrics",
    "dep:hane-presentation",
    "hane-ui/instrument",
]

[dependencies]
hane-document = { workspace = true, optional = true }
hane-ai.workspace = true
hane-markdown = { workspace = true, optional = true }
hane-metrics = { workspace = true, optional = true }
hane-network.workspace = true
hane-presentation = { workspace = true, optional = true }
hane-session.workspace = true
hane-ui.workspace = true
hane-update.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# HTTPS transport for the explicit "check for updates" action. Both crates are
# already resolved in Cargo.lock; the ring provider avoids a second crypto
# backend and the platform verifier chain (native roots) validates TLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
hane-ai = { workspace = true, features = ["test-support"] }
hane-update = { workspace = true, features = ["test-support"] }
# Signs the throw-away test CA / leaf certificates of the proxy fixtures. Already
# resolved in Cargo.lock through rustls and hane-update.
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_WindowsAndMessaging"] }

[[example]]
name = "gpui_baseline"
required-features = ["instrument"]
