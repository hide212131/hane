[package]
name = "hane-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
timing-probe = []
instrument = ["timing-probe"]

[dependencies]
merman.workspace = true
roxmltree = "=0.21.1"
serde_json = "=1.0.154"
async-channel.workspace = true
hane-document.workspace = true
hane-ai.workspace = true
hane-editor.workspace = true
hane-metrics.workspace = true
hane-markdown.workspace = true
hane-presentation.workspace = true
hane-session.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_Marshal", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# `#[implement]` の展開が crate ルートの `windows_core` を参照するため直接依存にする。
# `windows` 0.61 が使う windows-core 0.61.x と型互換にそろえる。
windows-core = "0.61.2"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }
