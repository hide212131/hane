[package]
name = "hane-voice"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hane-editor.workspace = true
hane-link.workspace = true
async-channel.workspace = true
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[[bin]]
name = "hane-voice-test-engine"
path = "src/bin/test_engine.rs"

[dev-dependencies]
hane-document.workspace = true
